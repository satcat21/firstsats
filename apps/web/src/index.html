<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>firstsats — learn Arkade by sending payments</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A reference application for the Arkade TypeScript SDK: create a Bitcoin wallet, send and receive VTXOs, and see what the protocol does at every step."
    />
    <!-- Tells the browser to paint the correct ground colour before Angular boots. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The icon font is self-hosted (see styles.scss) and preloaded: it is
         on the critical path, because without it every mat-icon renders as its
         ligature text first. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/material-symbols-outlined.woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#351791" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
