<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      What this does: stops third-party script loading. script-src 'self' is the
      directive earning its place. default-src 'none' makes the rest explicit,
      so an origin left out fails in the console rather than widening the policy.

      style-src cannot avoid 'unsafe-inline': Angular writes component styles at
      runtime, and the nonce alternative needs a per-response header a static
      site has none of. frame-ancestors is absent for the same reason.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'self'
                 https://signet.arkade.sh
                 https://mutinynet.arkade.sh
                 https://mempool.signet.arkade.sh
                 https://mempool.mutinynet.arkade.sh
                 https://mempool.space;
               base-uri 'self';
               form-action 'none';
               object-src 'none'"
    />
    <title>firstsats — learn Arkade by sending payments</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A reference application for the Arkade TypeScript SDK: create a Bitcoin wallet, send and receive VTXOs, and see what the protocol does at every step."
    />
    <!-- Tells the browser to paint the correct ground colour before Angular boots. -->
    <meta name="color-scheme" content="light dark" />
    <!--
      No preload for the icon font, though it is on the critical path.
      Production hashes it into media/ under a name only the build knows, so a
      static href here pointed at a file that has never existed in a release
      build and 404'd on every load. The stylesheet's own url() finds it, and
      font-display: block covers the gap until it lands.
    -->
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#351791" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
