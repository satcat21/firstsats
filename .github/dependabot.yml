# Dependabot answers the question `npm audit` in CI cannot: it watches the
# lockfile continuously and opens a PR when a fix lands upstream, rather than
# only failing at the moment someone happens to push.
#
# Enable "Dependabot alerts" and "Dependabot security updates" in the
# repository's Settings > Code security for the security half of this to work.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tooling bumps instead of five.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # The Angular front end is a separate npm project with its own lockfile.
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Every @angular/* package in one PR, runtime and tooling together.
      #
      # `compiler-cli` declares an exact peer on `compiler` -- 22.1.6 wants
      # 22.1.6, not ^22.1.6 -- so the two have to move in the same commit. They
      # were not: `compiler` is a dependency and `compiler-cli` a
      # devDependency, the dev-dependencies group claimed the dev half despite
      # this group being declared first, and the toolchain split across two PRs
      # that merged at different times. Every run in between had a skew that
      # `npm ci` refuses to resolve. Excluding them below is what keeps the
      # group whole.
      angular:
        patterns: ["@angular/*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns: ["@angular/*"]
    # TypeScript is pinned by Angular here, not by us. The compiler-cli declares
    # a peer dependency of >=6.0 <6.1. The root project has no Angular and tracks TypeScript 7 freely.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "web"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
